[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "examocrbench"
version = "0.1.0"
description = "Public inference and offline evaluation tools for ExamOCRBench"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "requests>=2.31", "jsonschema>=4.20"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
